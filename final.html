<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Download Link</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header class="header">

        <div class="logo">
            MOVIE<span>LINK</span>
        </div>

        <div class="header-status">
            ● READY
        </div>

    </header>


    <main class="generate-container">

        <div class="generate-card">


            <!-- READY -->

            <div id="readySection">

                <div class="success-icon">
                    ✓
                </div>

                <div class="step-label">
                    LINK GENERATED
                </div>

                <h1>
                    Your Link Is Ready
                </h1>

                <p class="status">
                    Your requested link has been generated successfully.
                </p>


                <button id="generateBtn">

                    Generate Link

                    <span>→</span>

                </button>

            </div>


            <!-- PRANK -->

            <div id="prankSection" class="hidden">

                <div class="prank-icon">
                    😂
                </div>

                <div class="step-label">
                    WAIT... WHAT?
                </div>

                <h1>
                    GOT PRANKED!
                </h1>

                <p class="prank-text">
                    Bhai movie nahi milegi 😭
                </p>

                <p class="small-text">
                    You just completed two countdowns for absolutely nothing.
                </p>


                <button onclick="location.href='index.html'">

                    Go Back

                    <span>←</span>

                </button>

            </div>


        </div>

    </main>


    <script src="final.js"></script>

</body>

</html>
