
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieLink</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            MOVIE<span>LINK</span>
        </div>

        <div class="header-status">
            ● ONLINE
        </div>

    </header>


    <!-- MAIN -->

    <main class="container">

        <div class="movie-card">


            <!-- POSTER -->

            <div class="poster-wrapper">

                <img
                    id="moviePoster"
                    class="poster"
                    src=""
                    alt="Movie Poster"
                >

                <div class="poster-quality">
                    HD
                </div>

            </div>


            <!-- MOVIE INFORMATION -->

            <div class="movie-info">

                <div class="movie-label">
                    MOVIE INFORMATION
                </div>

                <h1 id="movieTitle">
                    Movie Name
                </h1>


                <div class="meta" id="movieMeta">
                    2019 • Action / Sci-Fi • ⭐ 8.4
                </div>


                <p id="movieDescription" class="description">
                    Your requested link is ready.
                </p>


                <div class="download-info">

                    <div>
                        <span>QUALITY</span>
                        <strong>1080p</strong>
                    </div>

                    <div>
                        <span>LANGUAGE</span>
                        <strong>Hindi</strong>
                    </div>

                    <div>
                        <span>SIZE</span>
                        <strong>2.4 GB</strong>
                    </div>

                </div>


                <button id="getLinkBtn">

                    Get Link

                    <span>→</span>

                </button>


                <p class="notice">
                    Secure link generation • No registration required
                </p>

            </div>

        </div>


        <!-- ADSTERRA 300x250 -->

        <div class="ad-container">

            <script>
                atOptions = {
                    'key': '3974bfea2f504fecd3270303e9c1c227',
                    'format': 'iframe',
                    'height': 250,
                    'width': 300,
                    'params': {}
                };
            </script>

            <script src="https://bancadeltempoidea.org/22/3974bfea2f504fecd3270303e9c1c227"></script>

        </div>


    </main>


    <script src="script.js?v=2"></script>

</body>

</html>
